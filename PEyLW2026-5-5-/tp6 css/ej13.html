<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio13</title>
    <style>

input[type="text"] {
    border: 1px solid #C5C5C5;
    font-family: Arial;
    font-size: 12px;
    color: #666666;
    padding: 5px;
}

input[type="submit"],
input[type="reset"] {
    border: 1px solid #666666;
    font-family: Arial;
    color: #666666;
    background-color: #C5C5C5;
}

</style>
</head>
<body>
        <form>
        nombre:
<input type="text" name="nombre" maxlength="25">

<br><br>
apellido:
<input type="text" name="apellido" maxlength="25">
<br><br>
direccion:
<br>
<textarea name="direccion" rows="4" cols="30">
</textarea>
<br><br>
Telefono:
<input type="text" name="telefono" maxlength="15" value="0299-">
<br><br>
Operacion:
<br>
<input type="radio" name="operacion" value="alquiler">
Alquiler
<br>
<input type="radio" name="operacion" value="compra" checked>
Compra
<br><br>
Zona:
<br>
<input type="checkbox" name="centro" checked>
Zona Centro
<br>
<input type="checkbox" name="norte">
Zona Norte
<br>
<input type="checkbox" name="sur" checked>
Zona Sur
<br><br>
Comentario del inmueble que busca:

<br>
<textarea name="comentario" rows="5" cols="40">
</textarea>
<br><br>
<input type="reset" value="Borrar">
<input type="submit" value="Enviar">
</form>
</body>
</html>
